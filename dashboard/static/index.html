<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI USAGE</title>
<style>
:root{color-scheme:light;--ink:#242722;--muted:#697064;--line:#d7dacf;--paper:#f5f5ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:1000px;margin:auto;padding:38px 36px}button,select,a{font:inherit;color:inherit}button,select{cursor:pointer}button{background:none;border:0}a{text-decoration:none}h1{font:40px Georgia,serif;margin:0}h2{font-size:21px;margin:0}header{display:flex;align-items:center;justify-content:space-between;gap:18px}.head-actions{display:flex;align-items:center;gap:22px}#clock{font-size:24px;font-variant-numeric:tabular-nums}.utility{border:1px solid var(--line);padding:9px 14px;border-radius:4px}.date{color:var(--muted);font-size:14px;margin-top:12px}.nav{display:flex;border:1px solid var(--ink);margin:26px 0 20px}.nav button{width:50%;padding:15px;font-size:18px}.nav button+button{border-left:1px solid var(--ink)}.nav .active{background:var(--ink);color:white}.scope{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:40px;color:var(--muted);font-size:15px}.scope select{max-width:78%;background:transparent;border:0;padding:8px 0;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:12px 0 30px;background:white;border:1px solid var(--line)}.metric{padding:26px 30px;min-width:0}.metric:nth-child(2n){border-left:1px solid var(--line)}.metric:nth-child(n+3){border-top:1px solid var(--line)}.label{font-size:16px;color:var(--muted)}.value{margin-top:16px;font-size:48px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-1px;white-space:nowrap}.value .unit{font-size:27px;font-weight:400;letter-spacing:0;margin-left:6px}.value .currency{font-size:28px;font-weight:400;margin-right:4px}section.block{border-top:1px solid var(--line);padding-top:25px;margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px}.status{color:var(--muted);font-size:14px}.quota-row{margin-top:25px}.quota-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.quota-left{display:flex;gap:28px;align-items:baseline}.percent{font-size:25px;font-weight:600}.reset{color:var(--muted);font-size:15px}.track{height:9px;border:1px solid var(--ink);margin-top:12px}.track span{display:block;height:100%;background:var(--ink)}.stale .track span{background:#888}.conversation{padding:23px 0;border-bottom:1px solid var(--line)}.conversation-head{display:flex;justify-content:space-between;align-items:baseline;gap:22px}.conversation-title{font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.tokens{font-size:25px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}.meta{display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:14px;margin-top:11px}.empty{color:var(--muted);padding:30px 0}.device{border:1px solid var(--line);background:white;padding:25px;margin-top:18px}.device-name{font-size:23px;font-weight:600}.device-total{margin:20px 0;font-size:26px}.device-action{padding:0;text-decoration:underline;text-underline-offset:5px}.error{padding:14px;background:#f5e8cc;margin:15px 0}.hidden{display:none!important}footer{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);margin-top:32px;padding-top:18px;font-size:14px;color:var(--muted)}
@media(max-width:600px){main{padding:25px 22px}h1{font-size:32px}.head-actions{gap:14px}#clock{font-size:20px}.utility{padding:8px 10px}.metric{padding:23px 18px}.label{font-size:14px}.value{font-size:36px}.value .unit{font-size:22px}.value .currency{font-size:23px}.conversation-title{font-size:18px}.tokens{font-size:22px}.quota-left{gap:14px}.reset{font-size:13px}.percent{font-size:23px}.meta{font-size:13px}footer{font-size:13px}.status{font-size:13px}}
</style></head><body><main>
<header><h1>AI USAGE</h1><div class="head-actions"><span id="clock">--:--</span><button id="device-toggle" class="utility">设备</button></div></header><div id="date" class="date"></div>
<nav class="nav" aria-label="计费方式"><button data-view="usage" class="active">Coding Plan</button><button data-view="api">API</button></nav>
<div id="error" class="error hidden" role="status"></div>
<div id="dashboard-view"><div class="scope"><select id="scope-select" aria-label="用量来源"></select><span id="api-scope" class="hidden">全部已接入设备</span><span id="panel-state"></span></div>
<section class="metrics" aria-label="用量与金额"><article class="metric"><div id="today-cost-label" class="label">今日估算金额</div><div id="today-cost" class="value">—</div></article><article class="metric"><div class="label">今日 Tokens</div><div id="today-tokens" class="value">—</div></article><article class="metric"><div id="history-cost-label" class="label">近30天估算金额</div><div id="history-cost" class="value">—</div></article><article class="metric"><div class="label">近30天 Tokens</div><div id="history-tokens" class="value">—</div></article></section>
<section class="block"><div class="section-head"><h2 id="quota-title">Codex · 剩余额度</h2><span id="quota-state" class="status"></span></div><div id="quota"></div></section>
<section class="block"><div class="section-head"><h2 id="recent-title">最近对话</h2><span class="status" id="recent-unit">累计 Tokens</span></div><div id="conversations"></div></section></div>
<section id="devices-view" class="hidden"><div class="section-head"><h2>设备与用量来源</h2></div><div id="devices"></div></section>
<footer><span id="updated">等待数据</span><a id="kindle-link" href="/kindle" target="_blank">Kindle ↗</a></footer>
</main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:2}).format(n);
const fmt=(v,date=false)=>v?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',...(date?{month:'2-digit',day:'2-digit'}:{}),hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v)):'—';
let snapshot=null,view='usage',selected=null,devicesOpen=false;
function numberHTML(value,money=false){if(value==null)return '—';let text=money?(value>0&&value<.01?'<0.01':value>=10000?compact(value):value.toFixed(2)):compact(value);const unit=text.match(/[KMB]$/)?.[0]||'';if(unit)text=text.slice(0,-1);return (money?'<span class="currency">$</span>':'')+esc(text)+(unit?`<span class="unit">${unit}</span>`:'')}
function paint(){if(!snapshot)return;const s=snapshot,api=view==='api',choices=s.panels.plan_devices;const p=api?s.panels.api:choices.find(x=>x.device_id===selected)||choices[0]||{};
$('dashboard-view').classList.toggle('hidden',devicesOpen);$('devices-view').classList.toggle('hidden',!devicesOpen);$('device-toggle').setAttribute('aria-pressed',String(devicesOpen));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',!devicesOpen&&b.dataset.view===view));
$('scope-select').classList.toggle('hidden',api);$('api-scope').classList.toggle('hidden',!api);$('scope-select').innerHTML=choices.map(x=>`<option value="${esc(x.device_id)}" ${x.device_id===p.device_id?'selected':''}>${esc(x.scope)}</option>`).join('');
$('panel-state').textContent=api&&!p.connected?'未接入':({stale:'旧数据',partial:'部分记录',connecting:'读取中',disabled:'已关闭',unavailable:'等待数据'}[p.state]||'');
for(const period of ['today','history']){const b=p[period]||{};$(period+'-cost-label').textContent=(period==='today'?'今日':'近30天')+(p.cost_label||(api?'费用':'估算金额'));$(period+'-cost').innerHTML=numberHTML(b.cost_usd,true);$(period+'-tokens').innerHTML=numberHTML(b.tokens);}
$('quota-title').textContent=api?'API 费用':'Codex · 剩余额度';const provider=s.quotas?.providers.find(x=>x.id==='codex');$('quota-state').textContent=api?'':provider?.stale?'旧数据':'';
$('quota').innerHTML=api?`<div class="empty">${p.connected?'余额未接入':'接入后显示费用与用量'}</div>`:provider?.windows.length?provider.windows.map(w=>`<div class="quota-row ${provider.stale?'stale':''}"><div class="quota-head"><div class="quota-left"><span>${esc({session:'时段剩余',weekly:'本周剩余'}[w.kind]||w.label)}</span><span class="percent">${esc(w.remaining_percent)}%</span></div><span class="reset">${w.expired?'已到期 · 待更新':w.reset_at?esc(fmt(w.reset_at,w.kind!=='session'))+' 重置':'重置时间未知'}</span></div><div class="track" role="img" aria-label="剩余 ${esc(w.remaining_percent)}%"><span style="width:${Number(w.remaining_percent)}%"></span></div></div>`).join(''):'<div class="empty">暂无额度</div>';
$('recent-title').textContent=api?'最近调用':'最近对话';$('recent-unit').textContent=api?'Tokens':'累计 Tokens';$('conversations').innerHTML=p.conversations?.length?p.conversations.slice(0,3).map(r=>`<article class="conversation"><div class="conversation-head"><span class="conversation-title" title="${esc(r.title||r.model)}">${esc(r.title||r.model+' 调用')}</span><span class="tokens">${esc(compact(r.tokens))}</span></div><div class="meta"><span>${esc(r.source)} · ${esc(r.device_name)}</span><span>${esc(fmt(r.last_usage,true))}</span></div></article>`).join(''):'<div class="empty">暂无记录</div>';
$('devices').innerHTML=s.devices.map(d=>`<article class="device"><div class="section-head"><span class="device-name">${esc(d.name)}</span><span class="status">${d.status.errors?'采集异常':d.online?'在线':d.seen?'离线':'待连接'}</span></div><div class="device-total">今日日志 ${d.seen&&d.status.files?esc(compact(d.today_tokens)):'—'} Tokens</div><div class="meta"><button class="device-action" data-device="${esc(d.id)}">查看 Coding Plan →</button><span>${esc(fmt(d.seen))}</span></div></article>`).join('');document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{selected=b.dataset.device;view='usage';devicesOpen=false;paint()});
$('clock').textContent=fmt(s.generated_at);$('date').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric'}).format(new Date(s.generated_at));$('updated').textContent='更新 '+fmt(p.measured_at)+(p.state==='stale'?' · 旧数据':'');$('kindle-link').href='/kindle?view='+view+(p.device_id?'&device='+encodeURIComponent(p.device_id):'');}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;devicesOpen=false;paint()});$('device-toggle').onclick=()=>{devicesOpen=!devicesOpen;paint()};$('scope-select').onchange=e=>{selected=e.target.value;paint()};
async function update(){try{const response=await fetch('/api/summary',{cache:'no-store',signal:AbortSignal.timeout(10000)});if(response.status===401){location.replace('/pair?next='+encodeURIComponent(location.pathname+location.search));return}if(!response.ok)throw Error();snapshot=await response.json();selected=selected||snapshot.panels.default_device;paint();$('error').classList.add('hidden')}catch{ $('error').textContent='连接中断 · 保留上次数据';$('error').classList.remove('hidden')}}update();setInterval(update,20000);
</script></body></html>
